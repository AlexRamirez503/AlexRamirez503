name: Build AztvTube ARM64 Stable Touch
on:
  push:
    paths:
      - '.github/workflows/build-aztvtube-swipe.yml'
      - 'build-assets/touch_patch.smali'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download base
        run: |
          curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -L --fail -o cobalt-arm64.apk https://github.com/reisxd/TizenTubeCobalt/releases/download/v2.0.2/cobalt-arm64.apk
      - name: Decode
        run: java -jar apktool.jar d -f cobalt-arm64.apk -o decoded
      - name: Add stable native touch gestures
        shell: bash
        run: |
          FILE=$(find decoded -type f -path '*dev/cobalt/shell/ContentViewRenderView.smali' | head -1)
          test -n "$FILE"
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          fields='\n.field private mAztvTouchStartX:F\n.field private mAztvTouchStartY:F\n.field private mAztvTouchMoved:Z\n.field private mAztvLastTapTime:J\n'
          if 'mAztvTouchStartX:F' not in s:
              pos=s.find('\n.method ')
              if pos < 0: raise SystemExit('No method marker')
              s=s[:pos]+fields+s[pos:]
          p.write_text(s)
          PY
          cat build-assets/touch_patch.smali >> "$FILE"
      - name: Keep original Cobalt lifecycle and server
        run: echo 'No lifecycle or server modifications'
      - name: Phone landscape
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='decoded/AndroidManifest.xml'; ns='http://schemas.android.com/apk/res/android'
          ET.register_namespace('android',ns); t=ET.parse(p); r=t.getroot()
          for a in r.findall('.//activity'):
              n=a.get('{%s}name'%ns,'')
              if 'MainActivity' in n or 'CobaltActivity' in n:
                  a.set('{%s}screenOrientation'%ns,'sensorLandscape')
                  a.set('{%s}resizeableActivity'%ns,'true')
          t.write(p,encoding='utf-8',xml_declaration=True)
          PY
      - name: Rename label
        run: find decoded/res -type f -name '*.xml' -print0 | xargs -0 sed -i 's/TizenTube/AztvTube/g' || true
      - name: Build
        run: java -jar apktool.jar b decoded -o unsigned.apk
      - name: Align and sign
        shell: bash
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          keytool -genkeypair -noprompt -keystore stable.jks -storepass AztvTube2026 -keypass AztvTube2026 -alias aztvtube -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=AztvTube,OU=Android,O=AztvTube,L=Reno,ST=Nevada,C=US'
          "$ZIPALIGN" -f -p 4 unsigned.apk aligned.apk
          "$APKSIGNER" sign --ks stable.jks --ks-pass pass:AztvTube2026 --key-pass pass:AztvTube2026 --out AztvTube_ARM64_STABLE_TOUCH.apk aligned.apk
          "$APKSIGNER" verify --verbose AztvTube_ARM64_STABLE_TOUCH.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AztvTube_ARM64_STABLE_TOUCH
          path: AztvTube_ARM64_STABLE_TOUCH.apk
