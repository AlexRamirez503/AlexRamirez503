name: Build AztvTube ARM64 Hybrid Touch
on:
  push:
    paths:
      - '.github/workflows/build-aztvtube-swipe.yml'
      - 'build-assets/touch_patch.smali'
      - 't.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download base
        run: |
          curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -L --fail -o cobalt-arm64.apk https://github.com/reisxd/TizenTubeCobalt/releases/download/v2.0.2/cobalt-arm64.apk
      - name: Decode
        run: java -jar apktool.jar d -f cobalt-arm64.apk -o decoded
      - name: Add hybrid Android touch
        shell: bash
        run: |
          FILE=$(find decoded -type f -path '*dev/cobalt/shell/ContentViewRenderView.smali' | head -1)
          test -n "$FILE"
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          fields='\n.field private mAztvTouchStartX:F\n.field private mAztvTouchStartY:F\n.field private mAztvTouchMoved:Z\n.field private mAztvLastTapTime:J\n'
          if 'mAztvTouchStartX:F' not in s:
              pos=s.find('\n.method ')
              if pos < 0: raise SystemExit('No method marker')
              s=s[:pos]+fields+s[pos:]
          p.write_text(s)
          PY
          cat build-assets/touch_patch.smali >> "$FILE"
      - name: Phone landscape
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='decoded/AndroidManifest.xml'; ns='http://schemas.android.com/apk/res/android'
          ET.register_namespace('android',ns); t=ET.parse(p); r=t.getroot()
          for a in r.findall('.//activity'):
              n=a.get('{%s}name'%ns,'')
              if 'MainActivity' in n or 'CobaltActivity' in n:
                  a.set('{%s}screenOrientation'%ns,'sensorLandscape')
                  a.set('{%s}resizeableActivity'%ns,'true')
          t.write(p,encoding='utf-8',xml_declaration=True)
          PY
      - name: Rename packaged visible branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          changed=[]
          exts={'.xml','.smali','.json','.js','.html','.txt','.properties'}
          for p in Path('decoded').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts: continue
              try:s=p.read_text(encoding='utf-8')
              except:continue
              ns=s.replace('TizenTube','AztvTube')
              if ns!=s:
                  p.write_text(ns,encoding='utf-8'); changed.append(str(p))
          print('Brand files changed:',len(changed))
          PY
      - name: Route remote UI script through AztvTube wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          wrapper='https://raw.githubusercontent.com/AlexRamirez503/AlexRamirez503/main/t.js'
          pats=[
            re.compile(r'https://[^"\s]+(?:tizentube|TizenTube)[^"\s]*userScript\.js[^"\s]*',re.I),
            re.compile(r'https://cdn\.jsdelivr\.net/npm/@foxreis/tizentube/dist/userScript\.js[^"\s]*',re.I)
          ]
          hits=[]
          for p in Path('decoded').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.smali','.xml','.json','.js','.txt','.properties'}: continue
              try:s=p.read_text(encoding='utf-8')
              except:continue
              ns=s
              for pat in pats: ns,n=pat.subn(wrapper,ns); hits += [str(p)]*n
              if ns!=s: p.write_text(ns,encoding='utf-8')
          print('Remote UI endpoint replacements:',len(hits))
          for h in sorted(set(hits)): print(h)
          if not hits:
              print('No direct userscript URL found; leaving technical loading path intact.')
          PY
      - name: Build
        run: java -jar apktool.jar b decoded -o unsigned.apk
      - name: Align and sign
        shell: bash
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          keytool -genkeypair -noprompt -keystore hybrid.jks -storepass AztvTube2026 -keypass AztvTube2026 -alias aztvtube -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=AztvTube,OU=Android,O=AztvTube,L=Reno,ST=Nevada,C=US'
          "$ZIPALIGN" -f -p 4 unsigned.apk aligned.apk
          "$APKSIGNER" sign --ks hybrid.jks --ks-pass pass:AztvTube2026 --key-pass pass:AztvTube2026 --out AztvTube_ARM64_HYBRID_TOUCH_AZTV.apk aligned.apk
          "$APKSIGNER" verify --verbose AztvTube_ARM64_HYBRID_TOUCH_AZTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AztvTube_ARM64_HYBRID_TOUCH_AZTV
          path: AztvTube_ARM64_HYBRID_TOUCH_AZTV.apk
