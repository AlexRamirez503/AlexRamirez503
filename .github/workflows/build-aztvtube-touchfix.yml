name: Build AztvTube ARM64 TouchFix

on:
  push:
    paths:
      - '.github/workflows/build-aztvtube-touchfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download tools and APK
        run: |
          curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -L --fail -o cobalt-arm64.apk https://github.com/reisxd/TizenTubeCobalt/releases/download/v2.0.2/cobalt-arm64.apk
      - name: Decode
        run: java -jar apktool.jar d -f cobalt-arm64.apk -o decoded
      - name: Patch Android touch forwarding
        shell: bash
        run: |
          FILE=$(find decoded -type f -path '*dev/cobalt/shell/ContentViewRenderView.smali' | head -1)
          test -n "$FILE"
          echo '' | base64 -d >> "$FILE"
          grep -q 'onTouchEvent(Landroid/view/MotionEvent;)Z' "$FILE"
      - name: Rename visible label
        run: find decoded/res -type f -name '*.xml' -print0 | xargs -0 sed -i 's/TizenTube/AztvTube/g' || true
      - name: Build
        run: java -jar apktool.jar b decoded -o unsigned.apk
      - name: Align and sign
        shell: bash
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          keytool -genkeypair -noprompt -keystore touch.jks -storepass AztvTube2026 -keypass AztvTube2026 -alias aztvtube -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=AztvTube,OU=Android,O=AztvTube,L=Reno,ST=Nevada,C=US'
          "$ZIPALIGN" -f -p 4 unsigned.apk aligned.apk
          "$APKSIGNER" sign --ks touch.jks --ks-pass pass:AztvTube2026 --key-pass pass:AztvTube2026 --out AztvTube_ARM64_TOUCH_NATIVE.apk aligned.apk
          "$APKSIGNER" verify --verbose AztvTube_ARM64_TOUCH_NATIVE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AztvTube_ARM64_TOUCH_NATIVE
          path: AztvTube_ARM64_TOUCH_NATIVE.apk
