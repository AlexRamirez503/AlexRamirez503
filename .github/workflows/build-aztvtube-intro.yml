name: Build AztvTube ARM64 Intro
on:
  push:
    paths:
      - '.github/workflows/build-aztvtube-intro.yml'
      - 'build-assets/touch_patch.smali'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download base
        run: |
          curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -L --fail -o cobalt-arm64.apk https://github.com/reisxd/TizenTubeCobalt/releases/download/v2.0.2/cobalt-arm64.apk
      - name: Decode
        run: java -jar apktool.jar d -f cobalt-arm64.apk -o decoded
      - name: Preserve working touch
        shell: bash
        run: |
          FILE=$(find decoded -type f -path '*dev/cobalt/shell/ContentViewRenderView.smali' | head -1)
          test -n "$FILE"
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          fields='\n.field private mAztvTouchStartX:F\n.field private mAztvTouchStartY:F\n.field private mAztvTouchMoved:Z\n.field private mAztvLastTapTime:J\n'
          if 'mAztvTouchStartX:F' not in s:
              pos=s.find('\n.method ')
              if pos < 0: raise SystemExit('No method marker')
              s=s[:pos]+fields+s[pos:]
          p.write_text(s)
          PY
          cat build-assets/touch_patch.smali >> "$FILE"
      - name: Add real intro launcher
        shell: bash
        run: |
          mkdir -p decoded/res/raw decoded/smali/dev/cobalt/shell
          printf 'placeholder' > decoded/res/raw/intro.mp4
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ns='http://schemas.android.com/apk/res/android'
          ET.register_namespace('android',ns)
          p=Path('decoded/AndroidManifest.xml')
          t=ET.parse(p); root=t.getroot(); app=root.find('application')
          main_filter=None; main_owner=None; target=None
          for tag in ('activity','activity-alias'):
              for a in app.findall(tag):
                  for f in list(a.findall('intent-filter')):
                      acts=[x.get('{%s}name'%ns) for x in f.findall('action')]
                      cats=[x.get('{%s}name'%ns) for x in f.findall('category')]
                      if 'android.intent.action.MAIN' in acts and 'android.intent.category.LAUNCHER' in cats:
                          main_filter=f; main_owner=a
                          if tag=='activity-alias':
                              target=a.get('{%s}targetActivity'%ns)
                          else:
                              target=a.get('{%s}name'%ns)
                          a.remove(f)
                          break
                  if main_filter is not None: break
              if main_filter is not None: break
          if not target: raise SystemExit('No launcher target found')
          pkg=root.get('package','')
          if target.startswith('.'):
              target=pkg+target
          elif '.' not in target:
              target=pkg+'.'+target
          intro=ET.SubElement(app,'activity',{
              '{%s}name'%ns:'dev.cobalt.shell.AztvIntroActivity',
              '{%s}exported'%ns:'true',
              '{%s}screenOrientation'%ns:'sensorLandscape',
              '{%s}theme'%ns:'@android:style/Theme.Black.NoTitleBar.Fullscreen'
          })
          intro.append(main_filter)
          for a in app.findall('activity'):
              n=a.get('{%s}name'%ns,'')
              if 'MainActivity' in n or 'CobaltActivity' in n or n==target:
                  a.set('{%s}screenOrientation'%ns,'sensorLandscape')
                  a.set('{%s}resizeableActivity'%ns,'true')
          t.write(p,encoding='utf-8',xml_declaration=True)
          smali=f'''.class public Ldev/cobalt/shell/AztvIntroActivity;
.super Landroid/app/Activity;
.source "AztvIntroActivity.java"

