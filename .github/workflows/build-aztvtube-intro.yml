'''
          Path('decoded/smali/dev/cobalt/shell/AztvIntroActivity.smali').write_text(smali)
          inner='''.class final Ldev/cobalt/shell/AztvIntroActivity$1;\n.super Ljava/lang/Object;\n.implements Landroid/media/MediaPlayer$OnCompletionListener;\n.field final synthetic this$0:Ldev/cobalt/shell/AztvIntroActivity;\n.method constructor <init>(Ldev/cobalt/shell/AztvIntroActivity;)V\n    .locals 0\n    iput-object p1, p0, Ldev/cobalt/shell/AztvIntroActivity$1;->this$0:Ldev/cobalt/shell/AztvIntroActivity;\n    invoke-direct {p0}, Ljava/lang/Object;-><init>()V\n    return-void\n.end method\n.method public onCompletion(Landroid/media/MediaPlayer;)V\n    .locals 1\n    iget-object v0, p0, Ldev/cobalt/shell/AztvIntroActivity$1;->this$0:Ldev/cobalt/shell/AztvIntroActivity;\n    invoke-virtual {v0}, Ldev/cobalt/shell/AztvIntroActivity;->openMain()V\n    return-void\n.end method\n'''
          Path('decoded/smali/dev/cobalt/shell/AztvIntroActivity$1.smali').write_text(inner)
          print('Original launcher:',target)
          PY
      - name: Keep original remote UI endpoint
        run: echo 'Original working remote UI endpoint preserved'
      - name: Build
        run: java -jar apktool.jar b decoded -o unsigned.apk
      - name: Align and sign
        shell: bash
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          keytool -genkeypair -noprompt -keystore intro.jks -storepass AztvTube2026 -keypass AztvTube2026 -alias aztvtube -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=AztvTube,OU=Android,O=AztvTube,L=Reno,ST=Nevada,C=US'
          "$ZIPALIGN" -f -p 4 unsigned.apk aligned.apk
          "$APKSIGNER" sign --ks intro.jks --ks-pass pass:AztvTube2026 --key-pass pass:AztvTube2026 --out AztvTube_ARM64_INTRO_PLACEHOLDER.apk aligned.apk
          "$APKSIGNER" verify --verbose AztvTube_ARM64_INTRO_PLACEHOLDER.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AztvTube_ARM64_INTRO_PLACEHOLDER
          path: AztvTube_ARM64_INTRO_PLACEHOLDER.apk
